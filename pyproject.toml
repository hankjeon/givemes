[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "givemes"
version = "0.1.0"
description = "평가 인원과 등수에 따른 업무 배점 조회"
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
givemes = "givemes:main"

[tool.setuptools.packages.find]
where = ["src"]
